<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur d'IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="card">
            <h1>Calculateur IMC</h1>
            <p class="subtitle">Classification OMS</p>

            <input id="poids" type="number" placeholder="Poids (kg)">
            <input id="taille" type="number" placeholder="Taille (cm)">

            <!-- <button type="button" onclick="calculerIMC()">Calculer</button> -->
            <button id="btnCalcul">Calculer</button>
            <div id="result" class="result"></div>

            <!-- GAUGE -->
            <div class="gauge">
                <div class="bar">
                    <div class="zone blue"></div>
                    <div class="zone green"></div>
                    <div class="zone yellow"></div>
                    <div class="zone orange"></div>
                    <div class="zone red"></div>
                </div>
                <div id="indicator" class="indicator"></div>
            </div>

            <!-- ZONE INFO IMC -->
            <div class="info-box">
                <div id="imcText"></div>
                <div id="categoryText"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
