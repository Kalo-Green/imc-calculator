<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur d'IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="card">
            <h1>Calculateur IMC</h1>

            <div class="form-group">
                <label for="weight">Poids (kg)</label>
                <input id="weight" type="number" placeholder="Ex : 70">
            </div>

            <div class="form-group">
                <label for="height">Taille (cm)</label>
                <input id="height" type="number" placeholder="Ex : 175">
            </div>

            <!-- <button type="button" onclick="calculerIMC()">Calculer</button> -->
            <button id="calculate-btn">Calculer</button>
            <div id="error-message" class="error-message"></div>

            <!-- GAUGE -->
            <div class="gauge">
                <div class="bar">
                    <div class="zone bg-blue"></div>
                    <div class="zone bg-green"></div>
                    <div class="zone bg-yellow"></div>
                    <div class="zone bg-orange"></div>
                    <div class="zone bg-red"></div>
                    <div class="zone bg-darkred"></div>
                </div>
                <div id="indicator" class="indicator"></div>
            </div>

            <!-- BMI RESULT -->
            <div class="result-box">
                <div id="bmi-result"></div>
                <div id="category-result"></div>
            </div>

            <div class="table-oms">
                <h2>Catégories IMC selon l’OMS</h2>
                <table>
                    <tr class="text-blue">
                        <td>Maigreur</td>
                        <td>IMC &lt; 18.5</td>
                    </tr>

                    <tr class="text-green">
                        <td>Poids normal</td>
                        <td>18.5 – 24.9</td>
                    </tr>

                    <tr class="text-yellow">
                        <td>Surpoids</td>
                        <td>25 – 29.9</td>
                    </tr>

                    <tr class="text-orange">
                        <td>Obésité modérée</td>
                        <td>30 – 34.9</td>
                    </tr>

                    <tr class="text-red">
                        <td>Obésité sévère</td>
                        <td>35 – 39.9</td>
                    </tr>

                    <tr class="text-darkred">
                        <td>Obésité très sévère</td>
                        <td>≥ 40</td>
                    </tr>
                </table>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
