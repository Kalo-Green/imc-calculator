<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur d'IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="card">
            <h1>Calculateur IMC</h1>

            <input id="poids" type="number" placeholder="Poids (kg)">
            <input id="taille" type="number" placeholder="Taille (cm)">

            <!-- <button type="button" onclick="calculerIMC()">Calculer</button> -->
            <button id="btnCalcul">Calculer</button>
            <div id="result" class="result"></div>

            <!-- GAUGE -->
            <div class="gauge">
                <div class="bar">
                    <div class="zone blue"></div>
                    <div class="zone green"></div>
                    <div class="zone yellow"></div>
                    <div class="zone orange"></div>
                    <div class="zone red"></div>
                    <div class="zone darkred"></div>
                </div>
                <div id="indicator" class="indicator"></div>
            </div>

            <!-- RESULT SECTION -->
            <div class="info-box">
                <div id="imcText"></div>
                <div id="categoryText"></div>
            </div>

            <div class="table-oms">

                <h2>Catégories IMC selon l’OMS</h2>

                <table>

                    <tr class="blue-text">
                        <td>Maigreur</td>
                        <td>IMC &lt; 18.5</td>
                    </tr>

                    <tr class="green-text">
                        <td>Poids normal</td>
                        <td>18.5 – 24.9</td>
                    </tr>

                    <tr class="yellow-text">
                        <td>Surpoids</td>
                        <td>25 – 29.9</td>
                    </tr>

                    <tr class="orange-text">
                        <td>Obésité modérée</td>
                        <td>30 – 34.9</td>
                    </tr>

                    <tr class="red-text">
                        <td>Obésité sévère</td>
                        <td>35 – 39.9</td>
                    </tr>

                    <tr class="darkred-text">
                        <td>Obésité très sévère</td>
                        <td>≥ 40</td>
                    </tr>

                </table>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
